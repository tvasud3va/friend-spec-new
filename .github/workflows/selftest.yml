name: selftest
on: [push, pull_request]
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-tests (scripted fake agent, no API calls)
        run: python3 friend/selftest/test_harness.py
